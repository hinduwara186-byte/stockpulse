name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Copy Web Assets to Android
        run: npx cap copy android

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Copy & Rename APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/StockPulse.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StockPulse-APK
          path: output/StockPulse.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "StockPulse Android APK v1.0.0"
          body: |
            ## 📱 StockPulse Android Native App
            
            Install this standalone APK on your Android device.
            
            ### Installation Instructions:
            1. Download **`StockPulse.apk`** below on your Android phone.
            2. Tap the downloaded file and select **Install**.
            3. If prompted, allow "Install from unknown sources" for your browser.
            4. Open **StockPulse** from your app drawer!
          files: output/StockPulse.apk
          draft: false
          prerelease: false
